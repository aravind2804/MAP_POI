<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2f33">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="POI Map">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <title>POI Map</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='leaflet/leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-view="map">
  <div class="shell">

    <header class="topbar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z" fill="currentColor"/>
          <circle cx="12" cy="10" r="2.6" fill="var(--bar)"/>
        </svg>
        <span>POI Map</span>
      </div>

      <form id="search-form" class="search" role="search" autocomplete="off">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
        </svg>
        <input id="search-q" type="search" placeholder="Search a place or address, e.g. Marina Beach, Chennai" aria-label="Search a place or address">
        <button id="search-btn" type="submit" class="btn primary">Search</button>
        <ul id="search-results" class="results" hidden></ul>
      </form>

      <div class="topbar-count"><strong id="total">0</strong> saved</div>
    </header>

    <div class="app">
      <aside class="panel">

        <form id="poi-form" class="card" novalidate>
          <h2>Add a location</h2>
          <p class="hint">Click the map, search a place, or type the details yourself. Everything stays in sync.</p>

          <label for="name">Name
            <input id="name" maxlength="100" placeholder="Marina Beach" autocomplete="off">
          </label>

          <label for="category">Category
            <select id="category"></select>
          </label>

          <div class="field">
            <label for="address">Address</label>
            <textarea id="address" rows="2" placeholder="Type an address, or click the map to fill it in"></textarea>
            <button type="button" id="find-address" class="btn small ghost">Find address on map</button>
          </div>

          <div class="row">
            <label for="latitude">Latitude
              <input id="latitude" inputmode="decimal" placeholder="13.050000" autocomplete="off">
            </label>
            <label for="longitude">Longitude
              <input id="longitude" inputmode="decimal" placeholder="80.282400" autocomplete="off">
            </label>
          </div>
          <p id="geo-status" class="status" role="status" aria-live="polite"></p>

          <label for="description">Description
            <textarea id="description" rows="3" maxlength="300" placeholder="Why is this place useful?"></textarea>
          </label>

          <div class="actions">
            <button type="submit" class="btn primary">Save location</button>
            <button type="button" id="clear-btn" class="btn ghost">Clear</button>
          </div>
          <p id="message" role="status" aria-live="polite"></p>
        </form>

        <section class="card" id="saved-card">
          <h2>Saved locations <span id="count" class="count"></span></h2>
          <div class="filters">
            <input id="search" type="search" placeholder="Filter saved places" aria-label="Filter saved places">
            <select id="filter" aria-label="Filter by category"></select>
          </div>
          <div class="backup">
            <button type="button" id="export-btn" class="btn small ghost">Export backup</button>
            <button type="button" id="import-btn" class="btn small ghost">Import backup</button>
            <input id="import-file" type="file" accept="application/json,.json" hidden>
          </div>
          <ul id="list"></ul>
          <p id="empty" class="empty" hidden></p>
        </section>

      </aside>

      <main id="map" aria-label="Map"></main>
      <button id="add-fab" class="btn primary fab" type="button" hidden>Add details for this pin</button>
      <div id="pick-sheet" class="sheet" hidden>
        <div class="sheet-text">
          <p id="pick-address" class="sheet-address">Pin placed.</p>
          <p id="pick-coords" class="sheet-coords"></p>
        </div>
        <button id="pick-add" class="btn primary" type="button">Save this place</button>
      </div>
    </div>

    <nav class="tabs" aria-label="Views">
      <button type="button" data-view="map" class="active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span>Map</span>
      </button>
      <button type="button" data-view="add">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Add</span>
      </button>
      <button type="button" data-view="saved">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
        <span>Saved</span>
      </button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="{{ url_for('static', filename='leaflet/leaflet.js') }}"></script>
  <script>window.POI_MODE = "server"; window.INITIAL_POI = {{ poi|tojson }};</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
